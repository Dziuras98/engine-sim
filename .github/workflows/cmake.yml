name: CMake

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: cmake-core-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Windows x64 core and scripting
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out recursive sources
        uses: actions/checkout@v4
        with:
          clean: true
          submodules: recursive

      - name: Configure MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install static Boost.Filesystem
        shell: powershell
        run: |
          $vcpkg = Join-Path $env:VCPKG_INSTALLATION_ROOT "vcpkg.exe"
          & $vcpkg install boost-filesystem:x64-windows-static-md
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install Flex and Bison
        shell: powershell
        run: choco install winflexbison3 --yes --no-progress

      - name: Configure headless core
        shell: powershell
        run: |
          $flex = (Get-Command win_flex.exe -ErrorAction Stop).Source
          $bison = (Get-Command win_bison.exe -ErrorAction Stop).Source
          $toolchain = Join-Path $env:VCPKG_INSTALLATION_ROOT "scripts/buildsystems/vcpkg.cmake"
          cmake -S nextcar-recorder -B build-core -A x64 `
            "-DCMAKE_TOOLCHAIN_FILE=$toolchain" `
            "-DVCPKG_TARGET_TRIPLET=x64-windows-static-md" `
            "-DFLEX_EXECUTABLE=$flex" `
            "-DBISON_EXECUTABLE=$bison"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build core, scripting and tests
        shell: powershell
        run: |
          cmake --build build-core --config Release `
            --target engine-sim engine-sim-script-interpreter engine-sim-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run engine-sim unit tests
        shell: powershell
        run: |
          $tests = @(Get-ChildItem build-core -Recurse `
            -Filter engine-sim-test.exe -File)
          if ($tests.Count -ne 1) {
            throw "Expected one engine-sim-test.exe, observed $($tests.Count)."
          }
          & $tests[0].FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
