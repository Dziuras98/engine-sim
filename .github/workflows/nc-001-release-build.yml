name: NC-001 Release build

on:
  workflow_dispatch:
  push:
    branches:
      - agent/nc-001-release-build
    paths:
      - tools/build-release.ps1
      - CMakeLists.txt
      - .gitmodules
      - dependencies/**/CMakeLists.txt
      - .github/workflows/nc-001-release-build.yml
  pull_request:
    branches:
      - master
      - agent/nc-000-repository-bootstrap
    paths:
      - tools/build-release.ps1
      - CMakeLists.txt
      - .gitmodules
      - dependencies/**/CMakeLists.txt
      - .github/workflows/nc-001-release-build.yml

jobs:
  release-build:
    name: Clean Release build
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - name: Checkout with pinned submodules
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Build engine-sim Release
        shell: pwsh
        run: |
          $diagnostics = Join-Path $PWD "artifacts/diagnostics"
          New-Item -ItemType Directory -Path $diagnostics -Force | Out-Null
          $stdout = Join-Path $diagnostics "build-release.stdout.log"
          $stderr = Join-Path $diagnostics "build-release.stderr.log"

          $process = Start-Process `
            -FilePath "pwsh" `
            -ArgumentList @("-NoProfile", "-File", ".\tools\build-release.ps1") `
            -RedirectStandardOutput $stdout `
            -RedirectStandardError $stderr `
            -NoNewWindow `
            -Wait `
            -PassThru

          Write-Host "--- build stdout tail ---"
          if (Test-Path -LiteralPath $stdout) {
            Get-Content -LiteralPath $stdout -Tail 120
          }
          Write-Host "--- build stderr tail ---"
          if (Test-Path -LiteralPath $stderr) {
            Get-Content -LiteralPath $stderr -Tail 120
          }

          if ($process.ExitCode -ne 0) {
            throw "tools/build-release.ps1 failed with exit code $($process.ExitCode)."
          }

      - name: Verify artifact contract
        shell: pwsh
        run: |
          $requiredPaths = @(
            "artifacts/Release/bin/engine-sim-app.exe",
            "artifacts/Release/bin/delta.conf",
            "artifacts/Release/assets/main.mr",
            "artifacts/Release/engine-resources/fonts",
            "artifacts/Release/engine-resources/shaders",
            "artifacts/Release/build-info.json",
            "artifacts/Release/run-engine-sim.ps1"
          )

          foreach ($path in $requiredPaths) {
            if (-not (Test-Path -LiteralPath $path)) {
              throw "Required Release artifact is missing: $path"
            }
          }

          $buildInfo = Get-Content -LiteralPath "artifacts/Release/build-info.json" -Raw | ConvertFrom-Json
          if ($buildInfo.configuration -ne "Release") {
            throw "Unexpected build configuration: $($buildInfo.configuration)"
          }
          if ($buildInfo.executable -ne "bin/engine-sim-app.exe") {
            throw "Unexpected executable path: $($buildInfo.executable)"
          }
          if ([double]$buildInfo.compileSeconds -le 0) {
            throw "Compilation time was not recorded."
          }

          Write-Host "Release artifact contract verified."
          Write-Host "Compile time: $($buildInfo.compileSeconds) s"
          Write-Host "Environment: $($buildInfo.environment.operatingSystem); CMake $($buildInfo.environment.cmake); Visual Studio $($buildInfo.environment.visualStudio)"

      - name: Verify non-zero error contract
        shell: pwsh
        run: |
          & pwsh -NoProfile -File .\tools\build-release.ps1 `
            -Generator "NC-001 intentionally missing generator" `
            -BuildDirectory "build/error-contract" `
            -ArtifactDirectory "artifacts/error-contract"

          $failureCode = $LASTEXITCODE
          if ($failureCode -eq 0) {
            throw "The build script returned success for an invalid generator."
          }

          Write-Host "Invalid generator returned expected non-zero exit code: $failureCode"
          exit 0

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nc-001-build-diagnostics
          path: artifacts/diagnostics
          if-no-files-found: error

      - name: Upload Release package
        uses: actions/upload-artifact@v4
        with:
          name: engine-sim-release-nc-001
          path: artifacts/Release
          if-no-files-found: error
