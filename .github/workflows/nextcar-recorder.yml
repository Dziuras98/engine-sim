name: nEXTcAR recorder port

on:
  pull_request:
    branches:
      - master
    paths:
      - "CMakeLists.txt"
      - "include/engine.h"
      - "include/ignition_module.h"
      - "dependencies/submodules/CMakeLists.txt"
      - "scripting/include/engine_node.h"
      - "scripting/include/node.h"
      - "scripting/src/compiler.cpp"
      - "nextcar-recorder/**"
      - ".github/workflows/nextcar-recorder.yml"
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nextcar-recorder-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  windows-source-build:
    name: Windows x64 source DLL and recording fixture
    runs-on: windows-latest
    timeout-minutes: 55

    steps:
      - name: Check out engine-sim and recursive dependencies
        uses: actions/checkout@v4
        with:
          clean: true
          submodules: recursive

      - name: Check out pinned ESRecorder headless fixture
        uses: actions/checkout@v4
        with:
          repository: Dziuras98/ESRecorder-nextcar
          ref: 8f8f7b0fabbbc80f414a003fc1998dda29b28755
          path: fixture/esrecorder
          clean: true

      - name: Capture dependency source identity
        shell: powershell
        run: |
          New-Item -ItemType Directory -Path ci-artifacts -Force | Out-Null
          git submodule status --recursive |
            Out-File -FilePath ci-artifacts/submodules.txt -Encoding utf8
          Copy-Item dependencies/submodules/piranha/src/path.cpp `
            ci-artifacts/piranha-path.cpp
          Copy-Item dependencies/submodules/piranha/include/path.h `
            ci-artifacts/piranha-path.h
          git -C dependencies/submodules/piranha rev-parse HEAD |
            Out-File -FilePath ci-artifacts/piranha-commit.txt -Encoding ascii
          git -C fixture/esrecorder rev-parse HEAD |
            Out-File -FilePath ci-artifacts/esrecorder-commit.txt -Encoding ascii

          $referenceDll = "fixture/esrecorder/es/esrecord-lib.dll"
          if (-not (Test-Path -LiteralPath $referenceDll -PathType Leaf)) {
            throw "Pinned ESRecorder fixture does not contain the reference DLL."
          }
          Get-FileHash $referenceDll -Algorithm SHA256 |
            Format-List Algorithm, Hash, Path |
            Set-Content ci-artifacts/reference-dll-hash.txt -Encoding utf8

      - name: Configure MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Install static Boost.Filesystem
        shell: powershell
        run: |
          $vcpkg = Join-Path $env:VCPKG_INSTALLATION_ROOT "vcpkg.exe"
          & $vcpkg install boost-filesystem:x64-windows-static-md
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install Flex and Bison
        shell: powershell
        run: choco install winflexbison3 --yes --no-progress

      - name: Configure recorder source build
        shell: powershell
        run: |
          $flex = (Get-Command win_flex.exe -ErrorAction Stop).Source
          $bison = (Get-Command win_bison.exe -ErrorAction Stop).Source
          $toolchain = Join-Path $env:VCPKG_INSTALLATION_ROOT "scripts/buildsystems/vcpkg.cmake"
          $command = 'cmake -S nextcar-recorder -B build-nextcar-recorder -A x64 ' +
            '"-DCMAKE_TOOLCHAIN_FILE=' + $toolchain + '" ' +
            '"-DVCPKG_TARGET_TRIPLET=x64-windows-static-md" ' +
            '"-DFLEX_EXECUTABLE=' + $flex + '" ' +
            '"-DBISON_EXECUTABLE=' + $bison + '" ' +
            '> ci-artifacts\configure.log 2>&1'
          cmd.exe /d /s /c $command
          $configureExitCode = $LASTEXITCODE
          Get-Content ci-artifacts/configure.log
          if ($configureExitCode -ne 0) { exit $configureExitCode }

      - name: Build recorder DLL and ABI tests
        shell: powershell
        run: |
          cmd.exe /d /s /c "cmake --build build-nextcar-recorder --config Release --target esrecord-lib nextcar-recorder-abi-layout-test nextcar-recorder-abi-runtime-test > ci-artifacts\build.log 2>&1"
          $buildExitCode = $LASTEXITCODE
          Get-Content ci-artifacts/build.log
          if ($buildExitCode -ne 0) { exit $buildExitCode }

      - name: Run ABI layout and runtime tests
        shell: powershell
        run: |
          cmd.exe /d /s /c "ctest --test-dir build-nextcar-recorder -C Release --output-on-failure -R nextcar-recorder-abi > ci-artifacts\ctest.log 2>&1"
          $testExitCode = $LASTEXITCODE
          Get-Content ci-artifacts/ctest.log
          if ($testExitCode -ne 0) { exit $testExitCode }

      - name: Verify DLL exports and dependencies
        shell: powershell
        run: |
          $dlls = @(Get-ChildItem build-nextcar-recorder -Recurse `
            -Filter esrecord-lib.dll -File)
          if ($dlls.Count -ne 1) {
            throw "Expected exactly one esrecord-lib.dll, observed $($dlls.Count)."
          }
          $dll = $dlls[0]
          $dll | Format-List FullName, Length, LastWriteTimeUtc |
            Tee-Object -FilePath ci-artifacts/outputs.txt

          $dependents = (& dumpbin.exe /dependents $dll.FullName | Out-String)
          $dependents | Set-Content ci-artifacts/dependents.txt -Encoding utf8
          if ($dependents -match '(?i)boost_[^\s]*\.dll') {
            throw "Recorder DLL has an external Boost runtime dependency."
          }

          $exports = (& dumpbin.exe /exports $dll.FullName | Out-String)
          $exports | Set-Content ci-artifacts/exports.txt -Encoding utf8
          $requiredExports = @(
            'ESRecord_Compile',
            'ESRecord_Initialise',
            'ESRecord_Update',
            'ESRecord_Record',
            'ESRecord_GetSimState',
            'ESRecord_GetState',
            'ESRecord_GetVersion',
            'ESRecord_GetMaxInstances',
            'ESRecord_GetEngineSimSourceRevision',
            'ESRecord_GetCompatibilityTarget',
            'ESRecord_Engine_GetName',
            'ESRecord_Engine_GetRedline',
            'ESRecord_Engine_GetDisplacement'
          )
          foreach ($requiredExport in $requiredExports) {
            if ($exports -notmatch [regex]::Escape($requiredExport)) {
              throw "Recorder DLL is missing export $requiredExport."
            }
          }

      - name: Build isolated reference and source hosts
        shell: powershell
        run: |
          dotnet build `
            fixture/esrecorder/src/ESRecorder.Cli/ESRecorder.Cli.csproj `
            --configuration Release `
            --runtime win-x64 `
            --output fixture/runner-reference
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $referenceDll = "fixture/runner-reference/es/esrecord-lib.dll"
          if (-not (Test-Path -LiteralPath $referenceDll -PathType Leaf)) {
            throw "Managed host output did not preserve the pinned reference DLL."
          }

          New-Item -ItemType Directory -Path fixture/runner-source -Force | Out-Null
          Copy-Item fixture/runner-reference/* fixture/runner-source -Recurse -Force

          $nativeDll = @(Get-ChildItem build-nextcar-recorder -Recurse `
            -Filter esrecord-lib.dll -File)
          if ($nativeDll.Count -ne 1) {
            throw "Source-built recorder DLL could not be resolved."
          }
          Copy-Item $nativeDll[0].FullName `
            fixture/runner-source/es/esrecord-lib.dll -Force

      - name: Inspect pinned reference DLL
        shell: powershell
        run: |
          $referenceDll = (Resolve-Path fixture/runner-reference/es/esrecord-lib.dll).Path
          (& dumpbin.exe /dependents $referenceDll | Out-String) |
            Set-Content ci-artifacts/reference-dependents.txt -Encoding utf8
          (& dumpbin.exe /exports $referenceDll | Out-String) |
            Set-Content ci-artifacts/reference-exports.txt -Encoding utf8

      - name: Compile legacy MR and record source-built one-second WAV
        shell: powershell
        run: |
          $runner = (Resolve-Path fixture/runner-source).Path
          $log = (Join-Path (Resolve-Path ci-artifacts).Path "source-recording-fixture.log")
          Push-Location $runner
          try {
            cmd.exe /d /s /c "ESRecorder.Cli.exe record --engine-script es/assets/main.mr --output recordings/source --name source-port-smoke --rpm 2000:10000 --throttle 50 --length 1 --warmup 60 --instances 1 > `"$log`" 2>&1"
            $fixtureExitCode = $LASTEXITCODE
          }
          finally {
            Pop-Location
          }
          Get-Content $log
          if ($fixtureExitCode -ne 0) { exit $fixtureExitCode }

      - name: Prepare byte-identical explicit-convolution parity hosts
        shell: powershell
        run: |
          & nextcar-recorder/tests/prepare_parity_hosts.ps1 `
            -ReferenceSource fixture/runner-reference `
            -SourceBuiltSource fixture/runner-source `
            -ReferenceDestination fixture/runner-parity-reference `
            -SourceBuiltDestination fixture/runner-parity-source `
            -EvidencePath ci-artifacts/parity-script-identity.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Record source-built explicit-convolution parity WAV
        shell: powershell
        run: |
          $runner = (Resolve-Path fixture/runner-parity-source).Path
          $log = (Join-Path (Resolve-Path ci-artifacts).Path "source-parity-recording.log")
          Push-Location $runner
          try {
            cmd.exe /d /s /c "ESRecorder.Cli.exe record --engine-script es/assets/main.mr --output recordings/parity-source --name source-parity --rpm 2000:10000 --throttle 50 --length 1 --warmup 60 --instances 1 > `"$log`" 2>&1"
            $fixtureExitCode = $LASTEXITCODE
          }
          finally {
            Pop-Location
          }
          Get-Content $log
          if ($fixtureExitCode -ne 0) { exit $fixtureExitCode }

      - name: Record pinned reference explicit-convolution parity WAV
        id: reference_recording
        continue-on-error: true
        shell: powershell
        run: |
          $runner = (Resolve-Path fixture/runner-parity-reference).Path
          $log = (Join-Path (Resolve-Path ci-artifacts).Path "reference-parity-recording.log")
          Push-Location $runner
          try {
            cmd.exe /d /s /c "ESRecorder.Cli.exe record --engine-script es/assets/main.mr --output recordings/parity-reference --name reference-parity --rpm 2000:10000 --throttle 50 --length 1 --warmup 60 --instances 1 > `"$log`" 2>&1"
            $fixtureExitCode = $LASTEXITCODE
          }
          finally {
            Pop-Location
          }
          Get-Content $log
          if ($fixtureExitCode -ne 0) { exit $fixtureExitCode }

      - name: Capture native runtime logs
        if: always()
        shell: powershell
        run: |
          $hosts = @(
            @{ Prefix = "source-smoke"; Path = "fixture/runner-source/es" },
            @{ Prefix = "source-parity"; Path = "fixture/runner-parity-source/es" },
            @{ Prefix = "reference-parity"; Path = "fixture/runner-parity-reference/es" }
          )
          foreach ($hostInfo in $hosts) {
            $nativeLogs = @(Get-ChildItem $hostInfo.Path -File `
              -Filter "*.log" -ErrorAction SilentlyContinue)
            foreach ($nativeLog in $nativeLogs) {
              $destination = Join-Path ci-artifacts `
                ($hostInfo.Prefix + "-" + $nativeLog.Name)
              Copy-Item $nativeLog.FullName $destination -Force
              Write-Host "Captured $($nativeLog.FullName)"
              Get-Content $nativeLog.FullName
            }
          }

      - name: Validate source-built recording fixture
        shell: powershell
        run: |
          $recording = "fixture/runner-source/recordings/source"
          $manifestPath = Join-Path $recording "recording-manifest.json"
          $csvPath = Join-Path $recording "dyno.csv"
          $wavePath = Join-Path $recording "source-port-smoke_2000_50.wav"
          foreach ($path in @($manifestPath, $csvPath, $wavePath)) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Recording fixture is missing $path."
            }
          }

          $manifest = Get-Content $manifestPath -Raw | ConvertFrom-Json
          if ($manifest.engine.nativeLibraryVersion -ne 2000) {
            throw "Manifest did not record native ABI 2000."
          }
          if ([string]::IsNullOrWhiteSpace($manifest.engine.name)) {
            throw "Manifest engine name is empty."
          }
          if (@($manifest.measurements).Count -ne 1) {
            throw "Expected one recorded measurement."
          }

          $csvLines = @(Get-Content $csvPath)
          if ($csvLines.Count -ne 2) {
            throw "Expected CSV header plus one measurement."
          }

          $wave = [System.IO.File]::ReadAllBytes($wavePath)
          if ($wave.Length -le 88244) {
            throw "Recorded WAV is too short or has no metadata chunk."
          }
          if ([Text.Encoding]::ASCII.GetString($wave, 0, 4) -ne 'RIFF' -or
              [Text.Encoding]::ASCII.GetString($wave, 8, 4) -ne 'WAVE' -or
              [Text.Encoding]::ASCII.GetString($wave, 36, 4) -ne 'data') {
            throw "Recorded file has an invalid RIFF/WAVE header."
          }
          if ([BitConverter]::ToInt32($wave, 24) -ne 44100 -or
              [BitConverter]::ToInt16($wave, 34) -ne 16 -or
              [BitConverter]::ToInt32($wave, 40) -ne 88200) {
            throw "Recorded WAV does not match one-second mono PCM16 at 44.1 kHz."
          }

          Copy-Item $recording ci-artifacts/recording-source-smoke -Recurse -Force
          "PASS: legacy MR compiled and recorded through source-built ABI 2000" |
            Set-Content ci-artifacts/recording-fixture-result.txt -Encoding ascii

      - name: Produce black-box reference parity report
        if: always()
        shell: powershell
        env:
          REFERENCE_STEP_OUTCOME: ${{ steps.reference_recording.outcome }}
        run: |
          $referenceRecording = "fixture/runner-parity-reference/recordings/parity-reference"
          $sourceRecording = "fixture/runner-parity-source/recordings/parity-source"
          $referenceManifest = Join-Path $referenceRecording "recording-manifest.json"
          $sourceManifest = Join-Path $sourceRecording "recording-manifest.json"
          $referenceWave = Join-Path $referenceRecording "reference-parity_2000_50.wav"
          $sourceWave = Join-Path $sourceRecording "source-parity_2000_50.wav"

          if (Test-Path -LiteralPath $referenceRecording -PathType Container) {
            Copy-Item $referenceRecording `
              ci-artifacts/recording-parity-reference -Recurse -Force
          }
          if (Test-Path -LiteralPath $sourceRecording -PathType Container) {
            Copy-Item $sourceRecording `
              ci-artifacts/recording-parity-source -Recurse -Force
          }

          $required = @($referenceManifest, $sourceManifest, $referenceWave, $sourceWave)
          $missing = @($required | Where-Object {
            -not (Test-Path -LiteralPath $_ -PathType Leaf)
          })
          if ($missing.Count -ne 0) {
            @(
              "Reference parity report unavailable.",
              "reference_step_outcome=$env:REFERENCE_STEP_OUTCOME",
              "missing_files:",
              ($missing -join "`n")
            ) | Set-Content ci-artifacts/parity-status.txt -Encoding utf8
            Get-Content ci-artifacts/parity-status.txt
            exit 0
          }

          $reference = Get-Content $referenceManifest -Raw | ConvertFrom-Json
          $source = Get-Content $sourceManifest -Raw | ConvertFrom-Json
          if ($reference.engine.nativeLibraryVersion -ne 1010) {
            throw "Reference parity host did not use pinned ABI 1010."
          }
          if ($source.engine.nativeLibraryVersion -ne 2000) {
            throw "Source parity host did not use source-built ABI 2000."
          }

          python nextcar-recorder/tests/compare_recordings.py `
            --reference-manifest $referenceManifest `
            --source-manifest $sourceManifest `
            --reference-wav $referenceWave `
            --source-wav $sourceWave `
            --json-output ci-artifacts/parity-report.json `
            --text-output ci-artifacts/parity-summary.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          @(
            "PASS: pinned ABI 1010 and source-built ABI 2000 outputs were compared.",
            "Both hosts used the same explicit-convolution engine-script bytes.",
            "No acoustic or telemetry parity thresholds are enforced in this exploratory gate."
          ) | Set-Content ci-artifacts/parity-status.txt -Encoding utf8

      - name: Upload source-built recorder
        uses: actions/upload-artifact@v4
        with:
          name: nextcar-esrecord-lib-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 14
          path: |
            build-nextcar-recorder/**/esrecord-lib.dll
            build-nextcar-recorder/**/nextcar-recorder-abi-layout-test.exe
            build-nextcar-recorder/**/nextcar-recorder-abi-runtime-test.exe

      - name: Upload recorder diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nextcar-recorder-diagnostics-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 14
          path: ci-artifacts/**
